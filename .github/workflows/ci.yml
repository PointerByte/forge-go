name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The release policy pins the EXACT toolchain go1.25.0, not merely a 1.25.0
  # language floor. Dependency refreshes run
  #   GOTOOLCHAIN=go1.25.0 go get -u=patch ./... go@1.25.0
  #   GOTOOLCHAIN=go1.25.0 go mod tidy -go=1.25.0
  # so CI must build and test with the same toolchain; a newer 1.25.x patch
  # would resolve dependencies differently from the released manifests.
  FORGE_GO_VERSION: go1.25.0
  FORGE_GO_DIRECTIVE: "1.25.0"
  GOTOOLCHAIN: go1.25.0

jobs:
  quality:
    name: Build, test and coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the immutable source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Confirm the exact build toolchain
        run: |
          actual="$(go env GOVERSION)"
          if [ "${actual}" != "${FORGE_GO_VERSION}" ]; then
            echo "toolchain drift: go env GOVERSION=${actual}, required ${FORGE_GO_VERSION}" >&2
            exit 1
          fi
          # Every manifest must keep the pinned go directive and must not carry a
          # toolchain directive that would silently upgrade the release build.
          fail=0
          while IFS= read -r modfile; do
            got="$(go mod edit -json "${modfile}" | jq -r '.Go')"
            chain="$(go mod edit -json "${modfile}" | jq -r '.Toolchain // "none"')"
            if [ "${got}" != "${FORGE_GO_DIRECTIVE}" ]; then
              echo "${modfile}: go directive ${got}, required ${FORGE_GO_DIRECTIVE}" >&2
              fail=1
            fi
            if [ "${chain}" != "none" ] && [ "${chain}" != "${FORGE_GO_VERSION}" ]; then
              echo "${modfile}: toolchain directive ${chain} would override ${FORGE_GO_VERSION}" >&2
              fail=1
            fi
          done < <(find . -name go.mod -not -path './.git/*' | sort)
          exit "${fail}"
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "gofmt reported unformatted files:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi
      - name: Vet every module
        run: |
          for module in . logger encrypt security cmd/qgo cmd/go-openssl portable component; do
            (cd "${module}" && GOWORK=off go vet ./...)
          done
      - name: Staticcheck every module
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          for module in . logger encrypt security cmd/qgo cmd/go-openssl portable component; do
            (cd "${module}" && GOWORK=off staticcheck ./...)
          done
      - name: Tests
        run: |
          for module in . logger encrypt security cmd/qgo cmd/go-openssl portable component; do
            (cd "${module}" && GOWORK=off go test ./...)
          done
      - name: Race detector
        run: |
          for module in . logger encrypt security cmd/qgo cmd/go-openssl portable component; do
            (cd "${module}" && GOWORK=off go test -race ./...)
          done
      - name: Per-module coverage floors
        run: ./scripts/check-coverage.sh
      - name: Deterministic shared vectors
        run: (cd portable && GOWORK=off go test -run TestDeterministicVectors ./...)

  security:
    name: Vulnerability, static security and secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the immutable source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          for module in . logger encrypt security cmd/qgo cmd/go-openssl portable component; do
            (cd "${module}" && GOWORK=off govulncheck ./...)
          done
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          for module in . logger encrypt security cmd/qgo cmd/go-openssl portable component; do
            (cd "${module}" && GOWORK=off gosec -quiet -exclude-generated ./...)
          done
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  openspec:
    name: OpenSpec strict validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the immutable source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate every spec and change
        run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict
        env:
          OPENSPEC_TELEMETRY: "0"

  component:
    name: TinyGo component build, determinism and stress qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Pinned by ADR 0012; scripts/fetch-tools.sh verifies every download.
      WASM_TOOLS_VERSION: "1.255.0"
      WASM_TOOLS_SHA256: 6e431ad26863c697cc30733aae69cbd9248f83811d9e63e4eb01061fc2ece013
      JCO_VERSION: "1.26.1"
      DENO_VERSION: v2.9.4
      # The compiler image is pinned by digest, not tag: a tag can be repointed
      # at different bytes, which would defeat the reproducibility constraint.
      TINYGO_IMAGE: tinygo/tinygo@sha256:b216f534ddbf277444407b014a3328b5c1ade403cc397f3ab48a14789bf99d0e
    steps:
      - name: Check out the immutable source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install exact Deno runtime
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Install checksum-verified wasm-tools
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/tools"
          archive="${RUNNER_TEMP}/wasm-tools.tar.gz"
          curl -sSLf -o "${archive}" \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/tools" --strip-components=1
          echo "${WASM_TOOLS_SHA256}  ${RUNNER_TEMP}/tools/wasm-tools" | sha256sum --check --strict
          echo "WASM_TOOLS=${RUNNER_TEMP}/tools/wasm-tools" >> "${GITHUB_ENV}"
      - name: Warm the pinned jco cache
        run: deno run -A "npm:@bytecodealliance/jco@${JCO_VERSION}" --version
      - name: Pull the digest-pinned TinyGo compiler
        run: docker pull "${TINYGO_IMAGE}"
      - name: The TinyGo build world must export the canonical interface
        run: ./component/scripts/check-world.sh
      - name: Generated WIT bindings must reproduce byte for byte
        run: ./component/scripts/check-generated.sh
      - name: Component and guest module checks
        run: ./component/scripts/check.sh
      - name: Build, validate, transpile and package the production component
        run: ./component/scripts/build.sh
      - name: Rebuild and require an identical bundle
        run: |
          set -Eeuo pipefail
          cp component/artifacts/SHA256SUMS "${RUNNER_TEMP}/first.sums"
          ./component/scripts/build.sh > /dev/null
          diff "${RUNNER_TEMP}/first.sums" component/artifacts/SHA256SUMS
      - name: The bundle must declare the production toolchain it was built with
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, sys
          chain = json.load(open("component/artifacts/toolchain.json"))
          expected = {"componentCompiler": "tinygo 0.41.1", "wasi": "0.2.0", "production": True}
          for key, want in expected.items():
              if chain.get(key) != want:
                  sys.exit(f"toolchain.json {key}={chain.get(key)!r}, expected {want!r}")
          print("toolchain evidence matches the ADR 0012 production selection")
          PY
      - name: Stress qualification — 200,000 sustained dispatches under wasmtime
        run: |
          set -Eeuo pipefail
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet wasmtime==47.0.1
          result=$("${RUNNER_TEMP}/venv/bin/python" \
            research/component-gc-soak/wasmtime_soak.py \
            component/artifacts/goforge.component.wasm 200000 | tail -1)
          echo "${result}"
          # ADR 0012 constraint 7. componentize-go fails this; TinyGo must not.
          case "${result}" in
            "OK 200000") ;;
            *) echo "stress qualification failed: ${result}" >&2; exit 1 ;;
          esac
      - name: Upload the release bundle for inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goforge-component-${{ github.sha }}
          path: component/artifacts/
          if-no-files-found: error
          retention-days: 14

  # The sustained-load blocker that previously withheld these gates is closed: ADR 0012 moved the
  # production compiler to TinyGo, and the `component` job above now proves 200,000 sustained
  # dispatches complete cleanly. The bundle carries `provenance.json` and `LICENSES.txt`, and its
  # digest is asserted reproducible.
  #
  # STILL NOT PRESENT ON PURPOSE: signature publication and registry release. Those need signing
  # credentials and an authorized release process, which is a deliberate human decision rather than
  # something CI should acquire on its own. The Cosign sign/verify/tamper flow is proven in
  # openspec/.../evidence/supply-chain-poc.md and can be wired here once release authority exists.
